<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>lets hoop!</title>
  <link rel="icon" type="image/png" href="assets/brand/lets-hoop.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="team-select-view"></div>
  <div id="app-view" style="display:none;">
    <div class="app-shell">
      <aside class="app-sidebar">
        <div class="sidebar-brand">
          <img src="assets/brand/lets-hoop.png" alt="lets hoop!" class="brand-mark"
               onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
          <span class="brand-word" style="display:none;">lets<span>hoop!</span></span>
        </div>
        <div id="nav-bar"></div>
      </aside>
      <div class="app-main">
        <div id="app-topbar"></div>
        <!-- Sibling of #view-content, never a child: every view renderer owns
             #view-content and assigns container.innerHTML, which would destroy
             a tab strip rendered inside it. -->
        <div id="view-tabs"></div>
        <div id="view-content"></div>
        <div id="sim-controls"></div>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="rng.js"></script>
  <script src="names.js"></script>
  <!-- ratings.js derives `overall` from the attributes; it must load before
       players-2026.js, which installs the getter on every player it builds. -->
  <script src="ratings.js"></script>
  <!-- archetypeLabel derives the display archetype from the attributes; it
       reads nothing but the player object, so anywhere after ratings works. -->
  <script src="archetypeLabel.js"></script>
  <script src="faces.js"></script>
  <script src="teams.js"></script>
  <script src="traits.js"></script>
  <script src="scouting.js"></script>
  <script src="players-2026.js"></script>
  <script src="relatives.js"></script>
  <script src="finances.js"></script>
  <script src="coaches.js"></script>
  <script src="feats.js"></script>
  <script src="league.js"></script>
  <script src="godMode.js"></script>
  <script src="careerHistory.js"></script>
  <script src="careerHistoryImport.js"></script>
  <script src="awards.js"></script>
  <script src="gmCareer.js"></script>
  <script src="gmMilestones.js"></script>
  <!-- owner.js is pure: it reads only its arguments and the cap helpers in
       data.js, so anywhere after data.js works. Placed by its subject. -->
  <script src="owner.js"></script>
  <!-- rivalries.js is pure: arithmetic on a pair of team ids. No load-order
       dependency of its own. -->
  <script src="rivalries.js"></script>
  <!-- difficulty.js is a lookup table and a multiply. It deliberately reaches
       nothing in the sim; validate-difficulty.js asserts that. -->
  <script src="difficulty.js"></script>
  <script src="history.js"></script>
  <!-- BOTH of these capture LEAGUE_HISTORY into their data blocks at LOAD
       time, so both must come after history.js. They sat above it briefly and
       captured null: detectLeagueTrades and every memory query would have been
       silently dead in the browser while passing every Node test, because in
       Node the require() resolves the real module regardless of tag order.
       gmMemory before gmAgenda, which captures gmMemory in turn. -->
  <script src="gmMemory.js"></script>
  <!-- gmAgenda.js is a pure READ over league state: getActiveRoster and
       getTeamPayroll (league.js), the cap helpers (data.js), currentPatience
       (owner.js), rivalsOf (rivalries.js), LEAGUE_HISTORY (history.js) and
       gmMemory. It rolls no dice and mutates nothing. -->
  <script src="gmAgenda.js"></script>
  <script src="historyToys.js"></script>
  <script src="schedule.js"></script>
  <script src="simEngine.js"></script>
  <script src="simEngineBoxScore.js"></script>
  <script src="compositeRatings.js"></script>
  <script src="ultimates.js"></script>
  <script src="skillCheck.js"></script>
  <script src="simEnginePossession.js"></script>
  <!-- gameCoach.js (in-game substitution/timeout decisions) is distinct from
       coaches.js (coach entities, hiring, specialties) above. It reads
       minutesWeight from simEngineBoxScore.js at load time, so it must come
       after it: in the browser these share one global scope and run in tag
       order, and loading it earlier made the whole script throw, leaving its
       const declarations permanently uninitialized. -->
  <script src="gameCoach.js"></script>
  <script src="gameSim.js"></script>
  <script src="fatigue.js"></script>
  <script src="injuries.js"></script>
  <script src="morale.js"></script>
  <script src="playoffs.js"></script>
  <script src="allStarWeekend.js"></script>
  <script src="rosterMoves.js"></script>
  <script src="tradeEvaluator.js"></script>
  <script src="progression.js"></script>
  <script src="draftPickValue.js"></script>
  <script src="trade.js"></script>
  <script src="draftProspects.js"></script>
  <script src="draftLotteryFormats.js"></script>
  <script src="draft.js"></script>
  <script src="seasonTransition.js"></script>
  <script src="autoGM.js"></script>
  <script src="commissioner.js"></script>
  <!-- Reads getTeamRoster/getTeamPayroll (league.js) and the cap helpers
       (data.js), but only when called at team-select time - it captures
       nothing at load, so anywhere after those two is fine. -->
  <script src="teamDossier.js"></script>
  <script src="ui/util.js"></script>
  <script src="ui/topbar.js"></script>
  <script src="ui/nav.js"></script>
  <script src="ui/saveLoad.js"></script>
  <script src="ui/liveFeed.js"></script>
  <script src="ui/draftPicker.js"></script>
  <script src="ui/teamLogo.js"></script>
  <script src="ui/teamSelect.js"></script>
  <!-- gmAgendaView.js builds the panel markup and is called BY dashboard.js,
       so it has to be defined first. It captures nothing at load. -->
  <script src="ui/gmAgendaView.js"></script>
  <script src="ui/dashboard.js"></script>
  <script src="ui/shotChart.js"></script>
  <script src="ui/roster.js"></script>
  <script src="ui/standings.js"></script>
  <script src="ui/powerRankings.js"></script>
  <script src="ui/schedule.js"></script>
  <script src="ui/playoffs.js"></script>
  <script src="ui/allStarWeekend.js"></script>
  <!-- Pure policy: reads only its arguments, so it has no load-order
       dependency of its own. Placed next to its only consumer. -->
  <script src="simRunner.js"></script>
  <script src="ui/simControls.js"></script>
  <script src="ui/settings.js"></script>
  <script src="ui/tradeCenter.js"></script>
  <script src="ui/commissioner.js"></script>
  <script src="ui/godMode.js"></script>
  <script src="ui/awards.js"></script>
  <script src="ui/seasonSummary.js"></script>
  <script src="ui/history.js"></script>
  <script src="ui/feats.js"></script>
  <script src="ui/gmCareerView.js"></script>
  <script src="ui/frivolities.js"></script>
  <script src="ui/playerProfile.js"></script>
  <script src="ui/careerLedger.js"></script>
  <script src="ui/badges.js"></script>
  <script src="ui/ultimates.js"></script>
  <script src="ui/playerComparison.js"></script>
  <script src="ui/draft.js"></script>
  <script src="freeAgency.js"></script>
  <!-- waivers.js captures estimateFairSalary and ROSTER_MAX from freeAgency.js
       into its data block at LOAD time, so it has to come after it. -->
  <script src="waivers.js"></script>
  <!-- affiliates.js captures MIN_SALARY from freeAgency.js and
       generateProspectClass from draftProspects.js at LOAD time. -->
  <script src="affiliates.js"></script>
  <!-- seasonRollover.js captures its dependencies (pushSeasonSnapshot,
       finalizeSeasonHistory, runOffseasonThroughDraft, runFreeAgencySilently,
       autoEnforceRosterSize, generateNewSeason, getTeamById) into a data
       block at LOAD time, so every one of them must already be defined —
       freeAgency.js above is the last of them. It is loaded here rather than
       next to ui/simControls.js, which calls it: that call happens at click
       time, long after every script has run. Loading it earlier would capture
       runFreeAgencySilently as undefined, exactly the way gameCoach.js broke
       when it was placed before simEngineBoxScore.js. -->
  <!-- save.js's browser bridge captures MARKET_TUNING (freeAgency.js) and
       TRADE_TUNING (tradeEvaluator.js) at LOAD time to re-apply difficulty when a
       save is loaded, so it has to come after both. It sat above freeAgency.js
       for a while and threw on load: every const in it stayed uninitialised, which
       killed the System tab and blocked the offseason at pushSeasonSnapshot. -->
  <script src="save.js"></script>
  <script src="seasonRollover.js"></script>
  <script src="freeAgencyBidding.js"></script>
  <script src="ui/freeAgency.js"></script>
  <script src="ui/scouting.js"></script>
  <script src="ui/leagueNews.js"></script>
  <script src="ui/transactions.js"></script>
  <script src="ui/affiliate.js"></script>
  <script src="ui/salaryCap.js"></script>
  <script src="ui/finances.js"></script>
  <script src="ui/coaching.js"></script>
  <script src="playerCareerController.js"></script>
  <script src="narrativeSystem.js"></script>
  <script src="randomEvents.js"></script>
  <script src="aiGmPlayerAwareness.js"></script>
  <script src="playerToGMTransition.js"></script>
  <script src="ui/playerCreation.js"></script>
  <script src="ui/playerDashboard.js"></script>
  <script src="ui/narrativeScenes.js"></script>
  <script src="ui/randomEventScenes.js"></script>
  <script src="ui/legacyView.js"></script>
  <script src="ui/pixelDunks.js"></script>
  <script src="ui/pixelChoreographer.js"></script>
  <script src="ui/pixelSprites.js"></script>
  <!-- Reads spriteColorsForPlayer/safeSpriteColor/SPRITE_CARD_NO_TEAM from
       pixelSprites.js at CALL time, not load time, but it is kept adjacent to
       its only dependency so the pairing is obvious. -->
  <script src="ui/pixelBust.js"></script>
  <!-- The dialogue trio. Pure data and predicates first; depends on nothing. -->
  <script src="dialogueScenes.js"></script>
  <!-- Captures teams/league/gmCareer/names/faces into its data block at LOAD
       time, so every one of them must already be defined above. -->
  <script src="dialogueContext.js"></script>
  <!-- The halftime panel. Pure data like dialogueScenes.js, but read by
       ui/dialogueBox.js at LOAD time, so it must come before it. -->
  <script src="studioShow.js"></script>
  <!-- Captures drawPixelBust/bustScale/bustColorsFor/BUST from pixelBust.js
       and interpolate from dialogueScenes.js at LOAD time, so it must come
       after BOTH. Loaded earlier this threw on every page load and left the
       whole module uninitialised — the same failure gameCoach.js hit when it
       was placed before simEngineBoxScore.js. -->
  <script src="ui/dialogueBox.js"></script>
  <script src="ui/pixelCourt.js"></script>
  <script src="ui/pixelAudio.js"></script>
  <script src="ui/pixelHud.js"></script>
  <script src="ui/pixelImpact.js"></script>
  <script src="ui/pixelMotion.js"></script>
  <script src="ui/pixelCoach.js"></script>
  <script src="ui/pixelGameView.js"></script>
  <script src="ui/championshipScene.js"></script>
  <script src="script.js"></script>
</body>
</html>
