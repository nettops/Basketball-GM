<!DOCTYPE html>
<!--
  THE ANIMATION LAB. A development page, not part of the game.

  Every animation in the watched game, side by side, on a loop, at whatever
  speed you want to look at it. It exists because the defects this pass was
  about — a body sinking below its own shadow, a layup releasing after the
  feet were back down, a landing that cut straight to idle — are all things
  you can only see by WATCHING one motion repeatedly, and the game gives you
  a third of a second of each in the middle of a possession.

  THE ONE RULE HERE: this page re-implements nothing. Every pose comes from
  drawPlayerSprite, every height and bend from resolveLifts, every dribble
  from dribbleNow, every beat length from BEAT. If the lab and the game
  disagree, the lab is wrong and this file is broken — that is the whole
  point of it, and the reason ui/pixelMotion.js was split out in the first
  place (see the note at the top of that file).

  Serve it: python scripts/devserver.py 8137  ->  /animation-lab.html
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Animation Lab</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; padding: 20px;
    background: #14161a; color: #e6edf3;
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  h1 { font-size: 16px; margin: 0 0 4px; letter-spacing: .06em; text-transform: uppercase; }
  .sub { color: #8b949e; margin: 0 0 18px; max-width: 70ch; }
  #controls {
    position: sticky; top: 0; z-index: 5;
    display: flex; flex-wrap: wrap; gap: 14px; align-items: center;
    background: #1c2027; border: 1px solid #2c333d; border-radius: 8px;
    padding: 10px 14px; margin-bottom: 20px;
  }
  #controls label { display: flex; gap: 6px; align-items: center; }
  button {
    font: inherit; background: #2c333d; color: #e6edf3;
    border: 1px solid #3d4652; border-radius: 5px; padding: 4px 12px; cursor: pointer;
  }
  button:hover { background: #3d4652; }
  button[aria-pressed="true"] { background: #2f6feb; border-color: #2f6feb; }
  #grid { display: flex; flex-wrap: wrap; gap: 14px; }
  figure {
    margin: 0; background: #1c2027; border: 1px solid #2c333d; border-radius: 8px;
    padding: 10px; width: 190px;
  }
  figcaption { margin-top: 8px; }
  .name { font-weight: 700; letter-spacing: .04em; }
  .beat { color: #8b949e; font-size: 11px; }
  .phase { color: #58a6ff; font-size: 11px; min-height: 1.5em; }
  canvas { display: block; width: 168px; height: 168px; image-rendering: pixelated; background: #0d1117; border-radius: 4px; }
</style>
</head>
<body>
<h1>Animation Lab</h1>
<p class="sub">
  Every animation the watched game plays, looping. Drawn by the game's own
  <code>drawPlayerSprite</code> and driven by the game's own motion curves —
  nothing here is a mock-up. Slow it down to check spacing; step frames to
  check contact.
</p>

<div id="controls">
  <label>speed
    <select id="speed">
      <option value="1">1x</option>
      <option value="0.5">0.5x</option>
      <option value="0.25" selected>0.25x</option>
      <option value="0.1">0.1x</option>
    </select>
  </label>
  <button id="playPause" aria-pressed="true">pause</button>
  <button id="stepBack">&laquo; frame</button>
  <button id="stepFwd">frame &raquo;</button>
  <label><input type="checkbox" id="shadow" checked> shadow &amp; floor</label>
  <label><input type="checkbox" id="tall"> 7'7" body</label>
  <span id="clock" class="beat"></span>
</div>

<div id="grid"></div>

<!-- The game's own modules, in the same dependency order index.html loads them.
     Sprites and motion are leaves; the choreographer is pulled in only for
     BEAT, and it reads skillCheck at load time, so that comes first. -->
<script src="skillCheck.js"></script>
<script src="ui/pixelSprites.js"></script>
<script src="ui/pixelMotion.js"></script>
<script src="ui/pixelChoreographer.js"></script>
<script>
(function () {
  'use strict';

  // Beat lengths come from the game. A local copy would be a second source of
  // truth and would go stale the first time one of them is retuned.
  const B = BEAT;
  const COLORS = { skin: '#bb876f', hair: '#272421', jersey: '#2f6feb', trim: '#ffffff' };
  const SCALE = 3, BOX = 56;           // 56x56 stage pixels, blown up 3x
  const FOOT_X = 28, FOOT_Y = 44;      // where the player stands in the box

  // --- helpers that build the same shapes the choreographer emits -----------
  // A phase timeline: [{ phase, ms }, ...] becomes keyframes the real
  // resolveLifts() can bracket, so the lab gets the game's easing for free.
  function keyframes(marker, phases, extra) {
    const kfs = [];
    let t = 0;
    phases.forEach(function (p) {
      t += p.ms;
      const m = Object.assign({ phase: p.phase, id: 'lab' }, extra || {});
      const kf = { t: t };
      kf[marker] = m;
      kfs.push(kf);
    });
    return kfs;
  }

  function totalMs(kfs) { return kfs.length ? kfs[kfs.length - 1].t : 1; }

  // Bracket a timeline at time `ms` and hand back the real lift resolution.
  function liftsAt(kfs, ms) {
    let i = 0;
    while (i < kfs.length - 2 && kfs[i + 1].t <= ms) i++;
    const a = kfs[i], b = kfs[i + 1] || kfs[i];
    const span = Math.max(1, b.t - a.t);
    const f = Math.max(0, Math.min(1, (ms - a.t) / span));
    return { lifts: resolveLifts(a, b, f, false), a: a, b: b, f: f };
  }

  // --- the animations -------------------------------------------------------
  // Each returns { opts, ball, phase } for a given ms into its own loop.
  // `opts` goes straight to drawPlayerSprite; `ball` is {x, y} in stage px or
  // null; `phase` is the label shown under the canvas.

  function shotAnim(three) {
    const g = three ? B.jumpGatherThree : B.jumpGatherMid;
    const r = three ? B.jumpRiseThree : B.jumpRiseMid;
    const kfs = keyframes('jump', [
      { phase: 'gather', ms: g }, { phase: 'rise', ms: r },
      { phase: 'release', ms: B.jumpRelease }, { phase: 'follow', ms: 420 },
      { phase: 'follow', ms: 260 }
    ], { three: three });
    return {
      label: three ? '3PT jump shot' : 'Mid-range pull-up',
      beat: g + 'g / ' + r + 'r / ' + B.jumpRelease + 'rel',
      ms: totalMs(kfs),
      at: function (ms) {
        const s = liftsAt(kfs, ms);
        const L = s.lifts;
        const follow = L.jumpFollow;
        const held = ms < g + r + B.jumpRelease;
        const cock = jumpCock(L.jumperLift);
        return {
          opts: {
            crouch: L.jumperCrouch, shooting: !follow && L.jumperLift > -1,
            following: follow, facing: 1
          },
          lift: L.jumperFoot,
          ball: held
            ? { x: 2, y: -(overheadBallOffset('jump', L.jumperLift) * cock + (1 + DRIBBLE_RISE) * (1 - cock)) }
            : null,
          phase: (s.a.jump && s.a.jump.phase) + (follow ? ' (follow-through)' : '')
        };
      }
    };
  }

  function layupAnim() {
    const kfs = keyframes('close', [
      { phase: 'gather', ms: B.closeGather }, { phase: 'rise', ms: B.closeRise },
      { phase: 'release', ms: B.closeRelease }, { phase: 'land', ms: B.flightIn }
    ], { side: 1 });
    return {
      label: 'Layup',
      beat: B.closeGather + 'g / ' + B.closeRise + 'r / ' + B.closeRelease + 'rel',
      ms: totalMs(kfs),
      at: function (ms) {
        const s = liftsAt(kfs, ms);
        const L = s.lifts;
        const airborne = L.closerLift >= 3;
        const held = ms < B.closeGather + B.closeRise + B.closeRelease;
        const cock = closeCock(L.closerLift);
        return {
          opts: {
            crouch: L.closerCrouch, facing: 1,
            layup: airborne ? { side: 1, extend: Math.min(1, L.closerLift / CLOSE_LIFT.rise) } : null,
            dribbling: !airborne ? { phase: 0.4, side: 1, crossing: false } : null
          },
          lift: L.closerFoot,
          ball: held
            ? { x: 3, y: -(overheadBallOffset('close', L.closerLift) * cock + (1 + DRIBBLE_RISE) * (1 - cock)) }
            : null,
          phase: (s.a.close && s.a.close.phase) || ''
        };
      }
    };
  }

  function dunkAnim() {
    const kfs = keyframes('dunk', [
      { phase: 'gather', ms: B.dunkGather }, { phase: 'rise', ms: B.dunkRise },
      { phase: 'slam', ms: B.dunkSlam }, { phase: 'land', ms: B.dunkLand },
      { phase: 'land', ms: 400 }
    ]);
    return {
      label: 'Dunk',
      beat: B.dunkGather + 'g / ' + B.dunkRise + 'r / ' + B.dunkSlam + 'slam',
      ms: totalMs(kfs),
      at: function (ms) {
        const s = liftsAt(kfs, ms);
        const L = s.lifts;
        const held = ms < B.dunkGather + B.dunkRise;
        const cock = dunkCock(L.dunkerLift);
        return {
          opts: { crouch: L.dunkerCrouch, dunking: L.dunkerLift >= 3, facing: 1 },
          lift: L.dunkerFoot,
          ball: held
            ? { x: 4, y: -(overheadBallOffset('dunk', L.dunkerLift) * cock + (1 + DRIBBLE_RISE) * (1 - cock)) }
            : null,
          phase: (s.a.dunk && s.a.dunk.phase) || ''
        };
      }
    };
  }

  // A dribble move, driven by the real dribbleNow() on the real beat clock.
  function moveAnim(label, move, beats, beatMs) {
    const total = beats * beatMs;
    return {
      label: label,
      beat: beats + ' beats x ' + beatMs + 'ms',
      ms: total + 500,
      at: function (ms) {
        const inMove = ms < total;
        const u = inMove ? (ms / beatMs) : 0;
        // The clock is HELD while a string plays, exactly as the view holds it.
        const now = dribbleNow(1, inMove ? { move: move, n: beats, u: u } : null);
        return {
          opts: {
            facing: 1, moving: false,
            lean: dribbleLean(now),
            dribbling: { phase: now.phase, side: now.sign, crossing: now.crossing }
          },
          lift: 0,
          ball: {
            x: now.side * now.sign, y: -(1 + now.phase * DRIBBLE_RISE) - now.behind,
            behind: now.behind
          },
          phase: inMove ? ('beat ' + (Math.floor(u) + 1) + (now.crossing ? ' — crossing' : '')) : 'free dribble'
        };
      }
    };
  }

  function landingAnim() {
    const TOTAL = LANDING_TOTAL_MS + 260;
    return {
      label: 'Landing',
      beat: LANDING_COMPRESS_MS + 'ms in / ' + LANDING_RECOVER_MS + 'ms out',
      ms: TOTAL,
      at: function (ms) {
        // A short drop onto the floor, then the real recovery curve.
        const DROP = 160;
        const falling = ms < DROP;
        const since = ms - DROP;
        const squash = falling ? 0 : landingSquash(since, 'dunk');
        return {
          opts: { crouch: squash, facing: 1, dunking: falling },
          lift: falling ? Math.round((1 - ms / DROP) * 14) : 0,
          ball: null,
          phase: falling ? 'descending'
            : (since < LANDING_COMPRESS_MS ? 'contact — compressing'
              : (squash > 0.05 ? 'recovering' : 'settled'))
        };
      }
    };
  }

  function gaitAnim(label, moving, sprint) {
    return {
      label: label, beat: moving ? (sprint ? 'stride 90ms' : 'stride 200ms') : 'idle 800ms',
      ms: 1600,
      at: function (ms) {
        return {
          opts: {
            facing: 1, moving: moving,
            frame: Math.floor(ms / (sprint ? 90 : 200)) % 2,
            idleFrame: Math.floor(ms / 800) % 2
          },
          lift: 0, ball: null,
          phase: moving ? 'stride' : 'weight shift'
        };
      }
    };
  }

  function stopAnim() {
    // Sprint into a hard stop: the transition the brief calls out, with the
    // stop absorbed as a bend rather than as an instant pose swap.
    const RUN = 700, PLANT = 90, SETTLE = 260;
    return {
      label: 'Sprint → stop', beat: RUN + 'run / ' + PLANT + 'plant',
      ms: RUN + PLANT + SETTLE + 300,
      at: function (ms) {
        const running = ms < RUN;
        const since = ms - RUN;
        const squash = running ? 0 : landingSquash(since, 'close');
        return {
          opts: {
            facing: 1, moving: running,
            frame: Math.floor(ms / 90) % 2,
            crouch: squash,
            lean: running ? 0 : -Math.min(2, squash)
          },
          lift: 0, ball: null,
          phase: running ? 'sprinting' : (squash > 0.05 ? 'planting' : 'settled')
        };
      }
    };
  }

  function stumbleAnim() {
    return {
      label: 'Beaten (ankle)', beat: 'held 600ms', ms: 1400,
      at: function (ms) {
        return {
          opts: { facing: 1, stumbling: ms < 600 },
          lift: 0, ball: null,
          phase: ms < 600 ? 'off balance' : 'recovered'
        };
      }
    };
  }

  const ANIMS = [
    shotAnim(true), shotAnim(false), layupAnim(), dunkAnim(),
    moveAnim('Crossover', 'cross', 4, B.isoSize),
    moveAnim('Between the legs', 'double', 5, B.isoSize),
    moveAnim('Behind the back', 'behind', 4, B.isoSize),
    moveAnim('Ankle breaker', 'ankle', ANKLE_BEATS, B.crossJab),
    moveAnim('Put-down', 'putdown', 2, B.liveDribble),
    landingAnim(), stopAnim(), gaitAnim('Sprint', true, true),
    gaitAnim('Jog', true, false), gaitAnim('Idle', false, false),
    stumbleAnim()
  ];

  // --- the page -------------------------------------------------------------
  const grid = document.getElementById('grid');
  const speedSel = document.getElementById('speed');
  const playBtn = document.getElementById('playPause');
  const shadowBox = document.getElementById('shadow');
  const tallBox = document.getElementById('tall');
  const clockEl = document.getElementById('clock');
  let playing = true, clockMs = 0;

  const cells = ANIMS.map(function (anim) {
    const fig = document.createElement('figure');
    const cv = document.createElement('canvas');
    cv.width = BOX * SCALE; cv.height = BOX * SCALE;
    const cap = document.createElement('figcaption');
    cap.innerHTML = '<div class="name"></div><div class="beat"></div><div class="phase"></div>';
    fig.appendChild(cv); fig.appendChild(cap);
    grid.appendChild(fig);
    cap.querySelector('.name').textContent = anim.label;
    cap.querySelector('.beat').textContent = anim.beat + '  ·  ' + Math.round(anim.ms) + 'ms';
    const ctx = cv.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    return { anim: anim, ctx: ctx, phaseEl: cap.querySelector('.phase') };
  });

  function drawCell(cell) {
    const ctx = cell.ctx, anim = cell.anim;
    const ms = clockMs % anim.ms;
    const s = anim.at(ms);

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, BOX * SCALE, BOX * SCALE);
    ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);

    if (shadowBox.checked) {
      // The floor line, drawn where the game draws the shadow. This is the
      // reference the sinking-gather defect was invisible without.
      ctx.fillStyle = '#232a33';
      ctx.fillRect(0, FOOT_Y, BOX, 1);
      ctx.fillStyle = 'rgba(0,0,0,0.28)';
      ctx.fillRect(FOOT_X - 4, FOOT_Y - 1, 8, 2);
    }

    const opts = Object.assign({ heightIn: tallBox.checked ? 91 : 79 }, s.opts);
    drawPlayerSprite(ctx, FOOT_X, FOOT_Y - (s.lift || 0), COLORS, '23', opts);

    if (s.ball) {
      drawBall(ctx, FOOT_X + s.ball.x, FOOT_Y - (s.lift || 0) + s.ball.y);
    }
    cell.phaseEl.textContent = s.phase || '';
  }

  function drawAll() {
    cells.forEach(drawCell);
    clockEl.textContent = Math.round(clockMs) + 'ms';
  }

  let last = null;
  function tick(now) {
    if (last === null) last = now;
    const dt = now - last;
    last = now;
    if (playing) clockMs += dt * parseFloat(speedSel.value);
    drawAll();
    requestAnimationFrame(tick);
  }

  playBtn.addEventListener('click', function () {
    playing = !playing;
    playBtn.textContent = playing ? 'pause' : 'play';
    playBtn.setAttribute('aria-pressed', String(playing));
  });
  document.getElementById('stepFwd').addEventListener('click', function () {
    playing = false; playBtn.textContent = 'play'; playBtn.setAttribute('aria-pressed', 'false');
    clockMs += 1000 / 60; drawAll();
  });
  document.getElementById('stepBack').addEventListener('click', function () {
    playing = false; playBtn.textContent = 'play'; playBtn.setAttribute('aria-pressed', 'false');
    clockMs = Math.max(0, clockMs - 1000 / 60); drawAll();
  });
  [shadowBox, tallBox].forEach(function (el) { el.addEventListener('change', drawAll); });

  requestAnimationFrame(tick);
}());
</script>
</body>
</html>
